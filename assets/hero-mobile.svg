<svg xmlns="http://www.w3.org/2000/svg" width="600" height="692" viewBox="0 0 600 692" role="img" aria-label="Thang Ho — Backend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a13"/>
      <stop offset="1" stop-color="#0d1222"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2cf785"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="600" height="692" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="600" height="692" rx="24"/></clipPath>

    <!-- typing reveals: one clip per command line -->
    <clipPath id="t1"><rect x="0" y="-22" height="34" width="0"><animate attributeName="width" from="0" to="480" begin="0.6s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="-22" height="34" width="0"><animate attributeName="width" from="0" to="480" begin="2.0s" dur="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="-22" height="34" width="0"><animate attributeName="width" from="0" to="480" begin="3.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="0" y="-22" height="34" width="0"><animate attributeName="width" from="0" to="480" begin="5.0s" dur="1.1s" fill="freeze"/></rect></clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace; }
      .sans { font-family: 'Inter','Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif; }
      .out { opacity: 0; animation: show .4s ease-out forwards; }
      @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.15); opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="600" height="692" fill="url(#bg)"/>
    <ellipse class="pulse" cx="120" cy="90" rx="320" ry="240" fill="url(#glowA)"/>
    <ellipse class="pulse" cx="520" cy="640" rx="340" ry="250" fill="url(#glowB)" style="animation-delay:-3s"/>
    <rect width="600" height="692" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- top: identity -->
    <g transform="translate(40 0)">
      <g class="rise" style="animation-delay:.1s">
        <rect x="0" y="44" width="236" height="36" rx="18" fill="#2cf785" fill-opacity="0.08" stroke="#2cf785" stroke-opacity="0.35"/>
        <circle cx="21" cy="62" r="5.5" fill="#2cf785"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
        <text x="38" y="68" class="mono" font-size="16" fill="#a7f3d0" letter-spacing="0.5">open to cool ideas</text>
      </g>
      <text x="-4" y="172" class="sans rise" font-size="88" font-weight="800" letter-spacing="-2.5" fill="url(#name)" style="animation-delay:.25s">Thang Ho</text>
      <text x="0" y="220" class="sans rise" font-size="27" font-weight="600" fill="#e2e8f0" style="animation-delay:.45s">Backend Engineer <tspan fill="#64748b">·</tspan> Systems Tinkerer</text>
      <text x="0" y="260" class="mono rise" font-size="17" fill="#94a3b8" style="animation-delay:.6s">Go <tspan fill="#475569">/</tspan> TypeScript <tspan fill="#475569">/</tspan> Rust <tspan fill="#475569">/</tspan> Postgres <tspan fill="#475569">/</tspan> Linux</text>
      <text x="0" y="296" class="mono rise" font-size="15" fill="#64748b" style="animation-delay:.75s">📍 Vietnam  ·  building since 2017</text>
    </g>

    <!-- bottom: terminal -->
    <g transform="translate(40 336)">
      <rect x="0" y="0" width="520" height="316" rx="16" fill="#0b1020" fill-opacity="0.88" stroke="url(#border)" stroke-width="1.4"/>
      <rect x="0" y="0" width="520" height="44" rx="16" fill="#ffffff" fill-opacity="0.03"/>
      <circle cx="25" cy="22" r="7" fill="#ff5f57"/>
      <circle cx="48" cy="22" r="7" fill="#febc2e"/>
      <circle cx="71" cy="22" r="7" fill="#28c840"/>
      <text x="260" y="27" text-anchor="middle" class="mono" font-size="14" fill="#64748b">thang@arch: ~</text>

      <g class="mono" font-size="16">
        <g transform="translate(24 84)">
          <text clip-path="url(#t1)"><tspan fill="#2cf785">❯</tspan><tspan fill="#e2e8f0"> whoami</tspan></text>
        </g>
        <text x="24" y="112" class="out" fill="#94a3b8" style="animation-delay:1.6s">I build fast, boring, reliable backends</text>

        <g transform="translate(24 150)">
          <text clip-path="url(#t2)"><tspan fill="#2cf785">❯</tspan><tspan fill="#e2e8f0"> ls ~/building</tspan></text>
        </g>
        <text x="24" y="178" class="out" style="animation-delay:3.1s"><tspan fill="#22d3ee">velox/</tspan><tspan fill="#475569">  </tspan><tspan fill="#f472b6">shotr/</tspan><tspan fill="#475569">  </tspan><tspan fill="#a78bfa">mcp-servers/</tspan><tspan fill="#475569">  </tspan><tspan fill="#fbbf24">homelab/</tspan></text>

        <g transform="translate(24 216)">
          <text clip-path="url(#t3)"><tspan fill="#2cf785">❯</tspan><tspan fill="#e2e8f0"> uptime</tspan></text>
        </g>
        <text x="24" y="244" class="out" fill="#94a3b8" style="animation-delay:4.5s">coffee: ∞  ·  prod: green  ·  weekends: homelab</text>

        <g transform="translate(24 282)">
          <text clip-path="url(#t4)"><tspan fill="#2cf785">❯</tspan><tspan fill="#e2e8f0"> ./ship --scalable --reliable</tspan></text>
        </g>
        <g opacity="0">
          <set attributeName="opacity" to="1" begin="6.1s" fill="freeze"/>
          <rect x="322" y="268" width="10" height="19" fill="#2cf785" class="blink"/>
        </g>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="691" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
